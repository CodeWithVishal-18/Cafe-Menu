<html>
<head>
    <title>Marine Mocha|Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cafemenu.css">
</head>
<body>
    <div class="menu">
        <main>
            <h1>Chai & Chill</h1>
            <p class="established">Est. 2025</p>
            <hr>
            <section>
                <h2>Coffee</h2>
                <img src="images/coffee.jpg" alt="coffee icon" />
                <article class="item">
                    <p class="flavor">Filter Kaapi</p><p class="price">₹300</p>
                </article>
                <article class="item">
                    <p class="flavor">Masala Latte</p><p class="price">₹375</p>
                </article>
                <article class="item">
                    <p class="flavor">Cold Coffee Shikanji</p><p class="price">₹350</p>
                </article>
                <article class="item">
                    <p class="flavor">Hazelnut Cappuccino</p><p class="price">₹400</p>
                </article>
                <article class="item">
                    <p class="flavor">Mocha Maharaja</p><p class="price">₹450</p>
                </article>
            </section>

            <section>
                <h2>Desserts</h2>
                <img src="images/desert.jpg" alt="pie icon" />
                <article class="item">
                    <p class="dessert">Gulab Jamun Cheesecake</p><p class="price">₹150</p>
                </article>
                <article class="item">
                    <p class="dessert">Rasgulla Tiramisu</p><p class="price">₹275</p>
                </article>
                <article class="item">
                    <p class="dessert">Chocolate Jalebi Twist</p><p class="price">₹300</p>
                </article>
                <article class="item">
                    <p class="dessert">Kesar Pista Brownie</p><p class="price">₹250</p>
                </article>
            </section>
        </main>
        <hr class="bottom-line">
        <footer>
            <address>
                <p class="address">123, Marine Drive, Mumbai</p>
            </address>
        </footer>
    </div>
</body>
</html>
